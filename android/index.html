function jpgDim(u){let i=2;while(i<u.length){if(u[i]!=255){i++;continue}const m=u[i+1];if(m>=0xC0&&m<=0xCF&&m!=0xC4&&m!=0xC8&&m!=0xCC)return[(u[i+7]<<8)|u[i+8],(u[i+5]<<8)|u[i+6]];i+=2+((u[i+2]<<8)|u[i+3])}return[1654,2338]}
function pdfFromJpegs(list,name){const en=new TextEncoder(),parts=[],xr=[];let off=0;const push=b=>{parts.push(b);off+=b.length},s=t=>push(en.encode(t)),ob=(n,f)=>{xr[n]=off;s(n+' 0 obj\n');f();s('endobj\n')};
s('%PDF-1.4\n');const n=list.length,kids=list.map((_,i)=>(3+i*3)+' 0 R').join(' ');
ob(1,()=>s('<< /Type /Catalog /Pages 2 0 R >>\n'));ob(2,()=>s('<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>\n'));
list.forEach((u,i)=>{const d=jpgDim(u),W=595.28,H=+(W*d[1]/d[0]).toFixed(2),p=3+i*3;
ob(p,()=>s('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>\n'));
const c='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';ob(p+1,()=>s('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream\n'));
ob(p+2,()=>{s('<< /Type /XObject /Subtype /Image /Width '+d[0]+' /Height '+d[1]+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+u.length+' >>\nstream\n');push(u);s('\nendstream\n')})});
const total=3+n*3,xo=off;s('xref\n0 '+total+'\n0000000000 65535 f \n');for(let i=1;i<total;i++)s(String(xr[i]).padStart(10,'0')+' 00000 n \n');s('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
return new File(parts,name,{type:'application/pdf'})}

/* ===== v12: حوار داخلي بدل confirm الأصلي (يمنع تجمّد الإدخال) + شبكة أمان للتركيز ===== */
function askYN(msg,yes,no){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(15,12,25,.6);z-index:90;display:grid;place-items:center;padding:16px';o.innerHTML=`<div class=mb style='width:min(420px,100%)'><h3>${ic('scan',20)} المسح الضوئي</h3><p style='white-space:pre-line'>${esc(msg)}</p><div class=row><button class=btn id=ay>${esc(yes||'نعم')}</button><button class='btn s' id=an>${esc(no||'لا')}</button></div></div>`;document.body.appendChild(o);const done=v=>{o.remove();try{if(window.desk&&desk.refocus)desk.refocus()}catch(e){}res(v)};o.querySelector('#ay').onclick=()=>done(true);o.querySelector('#an').onclick=()=>done(false)})}
async function scanDoc(mode){if(!window.desk)return toast('المسح الضوئي متاح في نسخة البرنامج على سطح المكتب (exe) فقط. هنا اختر الملف من جهازك.');
if(scBusy&&Date.now()-scBusy<150000)return toast('المسح قيد التنفيذ، انتظر النتيجة (حتى دقيقتين) ثم حاول مرة أخرى');scBusy=Date.now();const adf=mode=='adf',pages=[];
try{for(;;){toast('جارٍ المسح الضوئي… لا تغلق النافذة (قد يستغرق حتى دقيقة)',1);const r=await desk.scan({adf});if(r.cancel)break;
if(r.err){toast('لم يتم المسح: '+r.err);scBusy=0;if(!pages.length&&await askYN(r.err+'\n\nهل تريد جلب آخر ملف ممسوح بتطبيق HP Scan من مجلد المسح بدلًا من ذلك؟','جلب آخر ملف','لا'))scanLatest();break}
(r.pages||[]).forEach(p=>pages.push(u8(p)));if(adf)break;if(!(await askYN('تم مسح '+pages.length+' صفحة.\nهل تريد مسح صفحة أخرى وإضافتها لنفس الملف (PDF)؟','مسح صفحة أخرى','إنهاء')))break}}catch(e){toast('تعذر تشغيل المسح الضوئي')}
scBusy=0;if(pages.length){const d=new Date(),p=n=>String(n).padStart(2,'0');SC.push(pdfFromJpegs(pages,`scan-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.pdf`));scl();toast('تم تجميع '+pages.length+' صفحة في ملف PDF واحد. اضغط «حفظ» لإضافته.',1)}}
async function scanLatest(){if(!(window.desk&&desk.latestScan))return toast('متاح في نسخة سطح المكتب فقط');let dir='';try{dir=localStorage.getItem('ins_scandir')||''}catch(e){}
const r=await desk.latestScan(dir);if(r.cancel)return;if(r.dir){try{localStorage.setItem('ins_scandir',r.dir)}catch(e){}}
if(r.err){try{localStorage.removeItem('ins_scandir')}catch(e){}return toast(r.err)}
if(!(await askYN('آخر ملف في مجلد المسح:\n'+r.name+'\n('+new Date(r.mtime).toLocaleString('ar-EG')+')\n\nهل تريد إضافته؟','إضافته','اختيار مجلد آخر'))){try{localStorage.removeItem('ins_scandir')}catch(e){}return}
const type=r.name.toLowerCase().endsWith('.pdf')?'application/pdf':r.name.toLowerCase().endsWith('.png')?'image/png':'image/jpeg';SC.push(new File([u8(r.data)],r.name,{type}));scl();toast('تمت إضافة الملف. اضغط «حفظ» لإضافته.',1)}
document.addEventListener('mousedown',()=>{try{if(window.desk&&desk.refocus&&!document.hasFocus())desk.refocus()}catch(e){}},true);
