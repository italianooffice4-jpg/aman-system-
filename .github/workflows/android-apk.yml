name: Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-v15.5.1-fresh-install
    paths:
      - 'android/**'
      - 'desktop/ui/**'
      - 'desktop/src/merge/aman-v13-ui.js'
      - 'desktop/scripts/lint-vue.mjs'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node dependencies
        working-directory: android
        run: npm install
      - name: Build web app and sync Capacitor
        working-directory: android
        run: npm run android:init
      - name: Build debug APK
        working-directory: android/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AmanSystem-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
