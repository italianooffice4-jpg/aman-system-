# يبني ملف APK لنسخة أندرويد على خوادم GitHub (لا يحتاج Android Studio على جهازك).
# التشغيل: تبويب Actions ← Build APK ← Run workflow. الناتج: Artifact باسم AmanSystem-apk.
# يفترض أن جذر المستودع هو المجلد الذي بداخله android و desktop.
name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install
        run: npm ci
      - name: Init Android project (build UI + cap add + sync)
        run: npm run android:init
      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AmanSystem-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
